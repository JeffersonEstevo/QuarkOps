services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quarkops}
      POSTGRES_USER: ${POSTGRES_USER:-quarkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarkops_dev}
    volumes:
      - quarkops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quarkops} -d ${POSTGRES_DB:-quarkops}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Sem "ports", pois na nuvem a comunicação é interna

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${RAILWAY_PUBLIC_DOMAIN:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-quarkops}
      POSTGRES_USER: ${POSTGRES_USER:-quarkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarkops_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: https://${RAILWAY_PUBLIC_DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - quarkops_static:/app/staticfiles

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_ADAPTER: http
        VITE_API_URL: /api
    restart: always
    environment:
      # O Nginx precisa saber o domínio para configurar o CORS e os cookies corretamente
      - BACKEND_HOST=backend:8000
      - SERVER_NAME=${RAILWAY_PUBLIC_DOMAIN:-localhost}
    depends_on:
      - backend
    volumes:
      - quarkops_static:/var/www/static:ro
    # O Railway usa a variável $PORT para rotear o tráfego
    # O Nginx do frontend vai escutar nela.
    ports:
      - "${PORT:-80}:80"

volumes:
  quarkops_pgdata:
  quarkops_static: