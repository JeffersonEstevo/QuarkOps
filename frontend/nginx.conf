server {
    listen 80;
    server_name _;

    # Root do React
    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────
    # Frontend React (SPA)
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─────────────────────────────────────────────────────────
    # Proxy para o Django (API)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        # Endereço correto do backend no Railway (sem números!)
        proxy_pass http://quarkops.railway.internal:8000/api/;
        
        proxy_http_version 1.1;
        
        # Headers essenciais para o POST funcionar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove a conexão "upgrade" que estava quebrando o Gunicorn
        proxy_set_header Connection ""; 
        
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # ─────────────────────────────────────────────────────────
    # Django Admin (proxy)
    # ─────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://quarkops.railway.internal:8000/admin/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────
    # Estáticos do Django (Admin)
    # ─────────────────────────────────────────────────────────
    location /static/ {
        include /etc/nginx/mime.types;
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}