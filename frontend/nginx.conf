server {
    listen 80;
    server_name _;

    # Resolver DNS interno do Railway (previne erro 504 por IP antigo)
    resolver [fd12::10] valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────
    # Frontend React (SPA)
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────
    # Proxy para o Django (API)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        # Usar variável força o Nginx a buscar o IP atualizado do backend
        set $backend_upstream "http://quarkops.railway.internal:8000";
        
        proxy_pass $backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # ─────────────────────────────────────────────────────────
    # Django Admin (proxy)
    # ─────────────────────────────────────────────────────────
    location /admin/ {
        # Mesma coisa aqui
        set $backend_upstream "http://quarkops.railway.internal:8000";
        
        proxy_pass $backend_upstream/admin/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────
    # Estáticos do Django
    # ─────────────────────────────────────────────────────────
    location /static/ {
        include /etc/nginx/mime.types;
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
    }
}