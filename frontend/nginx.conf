server {
    # O Railway injeta a porta via env var, mas no Dockerfile o Nginx escuta na 80
    listen 80;
    server_name _; # Aceita qualquer domínio (Railway, Render, etc)

    # ─────────────────────────────────────────────────────────
    # Frontend React (SPA)
    # ─────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────
    # Proxy para o Django (API)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        # Atualizado para o Railway
        proxy_pass http://quarkops.railway.internal:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # ─────────────────────────────────────────────────────────
    # Django Admin (proxy)
    # ─────────────────────────────────────────────────────────
    location /admin/ {
        # Atualizado para o Railway
        proxy_pass http://quarkops.railway.internal:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────────
    # Estáticos do Django
    # ─────────────────────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}