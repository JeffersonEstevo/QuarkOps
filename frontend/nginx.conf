server {
    listen 80;
    server_name _;

    # Resolver DNS interno do Railway (previne erro 504 por IP antigo)
    resolver [fd12::10] valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────
    # Frontend React (SPA) - Forçando atualização
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─────────────────────────────────────────────────────────
    # Proxy para o Django (API)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        set $backend_upstream "http://quarkops-caf9db12.railway.internal:8000";
        
        # CORREÇÃO: Remover a barra extra no final, se houver
        proxy_pass $backend_upstream/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Garantir que o POST não seja bloqueado
        proxy_method $request_method;
        
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10M;
    }

    # ─────────────────────────────────────────────────────────
    # Django Admin (proxy)
    # ─────────────────────────────────────────────────────────
    location /admin/ {
        set $backend_upstream "http://quarkops-caf9db12.railway.internal:8000";
        
        proxy_pass $backend_upstream/admin/;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_method $request_method;
        
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─────────────────────────────────────────────────────────
    # Estáticos do Django (Admin)
    # ─────────────────────────────────────────────────────────
    location /static/ {
        include /etc/nginx/mime.types;
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}